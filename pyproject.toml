[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-rsi-harness"
version = "0.1.0"
description = "PR-RSI Harness: self-evolving multi-agent harness for PR risk control and secure fixing"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
redis = ["redis>=5"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
pr-harness = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
