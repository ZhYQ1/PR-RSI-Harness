name: PR Risk Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  risk-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pr-harness
        run: python -m pip install .

      - name: Generate PR diff
        run: git diff "origin/${GITHUB_BASE_REF}...HEAD" > pr.diff

      - name: Run risk review
        env:
          SPARK_API_KEY: ${{ secrets.SPARK_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p data
          pr-harness --db data/harness.db submit \
            --repo "${GITHUB_REPOSITORY}" \
            --pr "${{ github.event.pull_request.number }}" \
            --branch "${GITHUB_HEAD_REF}" \
            --diff-file pr.diff > data/review.json 2>&1 || true

      - name: Check findings and block high-risk PRs
        if: always()
        run: |
          if [ -f data/review.json ]; then
            FINDINGS_COUNT=$(python3 -c "import json; d=json.load(open('data/review.json')); print(len(d.get('findings', [])))")
            echo "Detected $FINDINGS_COUNT risk(s)"
            if [ "$FINDINGS_COUNT" -gt 0 ]; then
              echo "::warning::PR-RSI Harness 检测到 $FINDINGS_COUNT 个安全风险，请修复后再合并"
              exit 1
            fi
          else
            echo "::error::PR-RSI Harness 未产生评审结果"
            exit 1
          fi

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### PR-RSI Harness risk review"
            echo '```json'
            cat data/review.json 2>/dev/null || echo '{"error": "review did not produce output"}'
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-risk-review
          path: |
            pr.diff
            data/review.json
          if-no-files-found: warn