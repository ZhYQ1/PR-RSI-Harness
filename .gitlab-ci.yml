stages:
  - risk-review

variables:
  # 数据库路径，CI 临时目录
  HARNESS_DB: "$CI_PROJECT_DIR/data/harness.db"

pr-risk-review:
  stage: risk-review
  image: python:3.11-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - python -m pip install --upgrade pip
    - python -m pip install .
  script:
    - |
      # 生成 MR diff（GitLab CI 中 $CI_MERGE_REQUEST_DIFF_ID 可用，但为兼容性使用 git diff）
      if [ -n "$CI_MERGE_REQUEST_ID" ]; then
        git fetch origin "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
        git diff "FETCH_HEAD...HEAD" > pr.diff || true
      else
        git diff "${CI_COMMIT_BEFORE_SHA}...${CI_COMMIT_SHA}" > pr.diff || true
      fi
    - |
      mkdir -p data
      pr-harness --db "$HARNESS_DB" submit \
        --repo "$CI_PROJECT_URL" \
        --pr "$CI_MERGE_REQUEST_IID" \
        --branch "$CI_COMMIT_BRANCH" \
        --diff-file pr.diff | tee data/review.json
    - |
      # 检查 findings，发现风险则失败（阻止 MR 合并）
      if [ -f data/review.json ]; then
        FINDINGS_COUNT=$(python3 -c "import json; d=json.load(open('data/review.json')); print(len(d.get('findings', [])))")
        echo "Detected $FINDINGS_COUNT risk(s)"
        if [ "$FINDINGS_COUNT" -gt 0 ]; then
          echo "ERROR: PR-RSI Harness 检测到 $FINDINGS_COUNT 个安全风险，请修复后再合并"
          exit 1
        fi
      else
        echo "ERROR: PR-RSI Harness 未产生评审结果"
        exit 1
      fi
  artifacts:
    paths:
      - pr.diff
      - data/review.json
    when: always
    expire_in: 7 days
  only:
    - merge_requests